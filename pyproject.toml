[project]
name = "teams-tui"
version = "0.1.0"
description = "Terminal client for Microsoft Teams"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.82.0",
    "playwright>=1.45.0",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.0.0",
    "dbus-next>=0.2.3",
]

[project.scripts]
teams-tui = "teams_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_tui"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.0",
]
